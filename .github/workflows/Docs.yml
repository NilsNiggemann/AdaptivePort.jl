name: Docs
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build and deploy
        run: |
          julia --project=examples -e 'using Pkg; Pkg.instantiate()'
          julia --project=examples examples/learner1d_plot.jl
          julia --project=examples examples/learner2d_rings.jl
          julia --project=examples examples/learner2d_spinice.jl
          julia --project=examples examples/phase_diagram/plot.jl
          julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
